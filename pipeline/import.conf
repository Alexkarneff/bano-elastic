input {
  file {
    path => "/data/bano-25.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    mode => "read"
    ecs_compatibility => disabled
  }
}

filter {
  csv {
    separator => ","
    columns => ["id","numero","voie","code_post","ville","source","lat","lon"]
  }

  mutate {
    convert => { "lat" => "float" "lon" => "float" }
  }

  mutate {
    rename => {
      "numero"    => "[address][number]"
      "voie"      => "[address][street_name]"
      "code_post" => "[address][zipcode]"
      "ville"     => "[address][city]"
      "lat"       => "[location][lat]"
      "lon"       => "[location][lon]"
    }
  }

  mutate { add_field => { "region" => "25" } }

  mutate {
    remove_field => ["message","@version","@timestamp","host","path","log","event"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "adresses-enrichies"
    document_id => "%{[request_id]}"
  }
}
