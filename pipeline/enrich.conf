input {
  http {
    port => 8080
    ecs_compatibility => disabled
    codec => json { ecs_compatibility => disabled }
  }
}

filter {
  if [address][zipcode] {
    mutate { add_field => { "dept" => "%{[address][zipcode]}" } }
    truncate { fields => ["dept"] length_bytes => 2 }
    if [dept] == "97" {
      mutate { replace => { "dept" => "%{[address][zipcode]}" } }
      truncate { fields => ["dept"] length_bytes => 3 }
    }
    mutate { add_field => { "index_suffix" => "-%{dept}" } }
  } else {
    mutate { add_field => { "dept" => "" } }
    mutate { add_field => { "index_suffix" => "" } }
  }
  if [location] and [location][lat] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      query_template => "/usr/share/logstash/templates/search-by-geo.json"
      index => "bano%{index_suffix}"
      fields => { "location" => "[location]" "address" => "[address]" }
      remove_field => ["headers", "host", "@version", "@timestamp", "event", "index_suffix", "dept"]
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      query_template => "/usr/share/logstash/templates/search-by-name.json"
      index => "bano%{index_suffix}"
      fields => { "location" => "[location]" "address" => "[address]" }
      remove_field => ["headers", "host", "@version", "@timestamp", "event", "index_suffix", "dept"]
    }
  }
}

output {
  stdout { codec => rubydebug }
}
