services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.3
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch: { condition: service_healthy }
    
  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.3
    container_name: logstash
    command: logstash -f /usr/share/logstash/pipeline/import.conf
    volumes:
      - ./pipeline:/usr/share/logstash/pipeline:ro
      - ./templates:/usr/share/logstash/templates:ro
      - ./bano-data:/data:ro
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
      - XPACK_MONITORING_ENABLED=false
    depends_on:
      elasticsearch: { condition: service_healthy }
    profiles: ["tools"]

  enrich:
    image: docker.elastic.co/logstash/logstash:8.17.3
    container_name: enrich
    command: logstash -r -f /usr/share/logstash/pipeline/enrich.conf
    volumes:
      - ./pipeline:/usr/share/logstash/pipeline:ro
      - ./templates:/usr/share/logstash/templates:ro
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
      - XPACK_MONITORING_ENABLED=false
    ports: ["8080:8080"]
    depends_on:
      elasticsearch: { condition: service_healthy }
    profiles: ["tools"]

volumes:
  es_data:
